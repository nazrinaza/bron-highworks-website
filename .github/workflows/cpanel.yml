name: BRON cPanel
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bron-cpanel-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-only-password
          MARIADB_DATABASE: bron_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, dom, fileinfo, curl, xml
          tools: composer:v2
          coverage: none
      - name: Install development dependencies
        working-directory: backend
        run: |
          composer validate --no-check-publish
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate --force
      - name: Test with SQLite
        working-directory: backend
        run: vendor/bin/phpunit
      - name: Test with MariaDB 11.4
        working-directory: backend
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: bron_test
          DB_USERNAME: root
          DB_PASSWORD: ci-only-password
        run: vendor/bin/phpunit
      - name: Install production dependencies
        working-directory: backend
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          composer check-platform-reqs --no-dev
      - name: Build cPanel archives
        run: python3 deploy/package.py
      - name: Verify production package and initial admin provisioning
        run: |
          python3 deploy/test_release.py
          python3 deploy/test_preflight.py
          python3 deploy/test_sync.py
          python3 deploy/test_cpanel_install.py
      - name: Store installation package and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bron-cpanel-${{ github.sha }}
          path: |
            build/bron-cpanel.zip
            build/bron-cpanel.tar.gz
            build/SHA256SUMS
            deploy/CPANEL.md
          retention-days: 30
          if-no-files-found: error
      - name: Explain next step
        run: |
          echo 'Download the artifact, then follow deploy/CPANEL.md. The cpanel branch is published after tests. No server changes occur until cPanel deploys it.' >> "$GITHUB_STEP_SUMMARY"
  publish-cpanel:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Publish tested package to cPanel branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name "bron-cpanel-$GITHUB_SHA" --dir artifact
          gh auth setup-git
          mkdir release
          cd release
          git init
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if git ls-remote --heads origin cpanel | grep -q refs/heads/cpanel; then
            git fetch --depth=1 origin cpanel
            git checkout -b cpanel FETCH_HEAD
            git rm -rf .
          else
            git checkout --orphan cpanel
          fi
          cp ../artifact/build/bron-cpanel.tar.gz .
          cp ../artifact/build/SHA256SUMS .
          cp ../.cpanel.yml .
          mkdir -p deploy
          cp ../deploy/cpanel-pull.sh ../deploy/public-index.php ../deploy/first-admin.php ../deploy/sync-files.php deploy/
          cp ../deploy/CPANEL-GIT.md .
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Build cPanel deployment from $GITHUB_SHA"
          git push origin HEAD:cpanel
          echo 'cPanel branch updated. In cPanel: Update from Remote, then Deploy HEAD Commit. See deploy/CPANEL-GIT.md.' >> "$GITHUB_STEP_SUMMARY"
